<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virtual Office Dashboard</title>
<link rel="icon" type="image/png" href="/assets/profile_photo.png">
<link rel="stylesheet" href="lobby/css/style.css" />
<style>
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); }
.overlay-card { background: rgba(17,24,39,0.88); border: 1px solid #334155; border-radius: 20px; padding: 40px 48px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.5); max-width: 420px; width: 90%; }
.overlay-card .photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; margin-bottom: 16px; background: #111827; }
.overlay-card h2 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 600; color: #dbeafe; }
.overlay-card .sub { color: #9ca3af; font-size: 0.95rem; margin: 0 0 24px; }
.overlay-card .btn-row { display: flex; flex-direction: column; gap: 10px; }
.overlay-card .btn { padding: 14px 24px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.overlay-card .btn-primary { background: #38bdf8; color: #0f172a; }
.overlay-card .btn-primary:hover { background: #7dd3fc; transform: translateY(-1px); }
.overlay-card .btn-secondary { background: transparent; color: #9ca3af; border: 1px solid #334155; }
.overlay-card .btn-secondary:hover { color: #dbeafe; border-color: #38bdf8; }
</style>
</head>
<body>
<main class="app">
  <h1>Virtual Office</h1>
  <p class="hint">Click anywhere on the office floor to move the character.</p>
  <div class="canvas-wrap">
    <canvas id="gameCanvas" aria-label="Virtual office simulation"></canvas>
  </div>
  <p id="status" class="status">Loading assets...</p>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <img class="photo" id="lobbyPhoto" src="/assets/profile_photo.png" alt="">
    <h2 id="lobbyName">Virtual Office Dashboard</h2>
    <p class="sub">Workspace Dashboard</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="enterDashboard()">Enter Dashboard</button>
      <button class="btn btn-secondary" onclick="adminLogin()">Admin Login</button>
    </div>
  </div>
</div>

<script type="module" src="lobby/js/game.js?v=24"></script>
<script>
function enterDashboard() { window.location.href = 'dashboard.html'; }
function adminLogin() { window.location.href = 'dashboard.html#login'; }
fetch('data/boss_name.json').then(function(r){ return r.json(); }).then(function(d){
  if (d && d.name) { document.getElementById('lobbyName').textContent = d.name; document.title = d.name + ' — Dashboard'; }
}).catch(function(){});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Office Dashboard</title>
<link rel="icon" type="image/png" href="/assets/profile_photo.png">
<style>
:root { color-scheme: dark; --bg: #0f172a; --panel: #111827; --text: #dbeafe; --muted: #9ca3af; --accent: #38bdf8; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, var(--bg) 50%); color: var(--text); font-family: Inter, Segoe UI, Roboto, system-ui, sans-serif; overflow: hidden; }

.lobby { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
.lobby .canvas-wrap { width: 100%; height: 100%; overflow: auto; background: #020617; position: absolute; inset: 0; }
.lobby #gameCanvas { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.lobby .status { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); margin: 0; color: var(--accent); font-size: 0.95rem; z-index: 2; }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); }
.overlay-card { background: rgba(17,24,39,0.88); border: 1px solid #334155; border-radius: 20px; padding: 40px 48px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.5); max-width: 420px; width: 90%; }
.overlay-card .photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 16px; background: var(--panel); }
.overlay-card h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 600; }
.overlay-card .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 24px; }
.overlay-card .btn-row { display: flex; flex-direction: column; gap: 10px; }
.overlay-card .btn { padding: 14px 24px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.overlay-card .btn-primary { background: var(--accent); color: #0f172a; }
.overlay-card .btn-primary:hover { background: #7dd3fc; transform: translateY(-1px); }
.overlay-card .btn-secondary { background: transparent; color: var(--muted); border: 1px solid #334155; }
.overlay-card .btn-secondary:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<div class="lobby" id="lobby">
  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
  <p class="status" id="status">Loading assets...</p>
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <img class="photo" id="lobbyPhoto" src="/assets/profile_photo.png" alt="">
      <h1 id="lobbyName">Virtual Office Dashboard</h1>
      <p class="sub" id="lobbySub">Workspace Dashboard</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="enterDashboard()">Enter Dashboard</button>
        <button class="btn btn-secondary" onclick="adminLogin()">Admin Login</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="lobby/js/game.js"></script>
<script>
function enterDashboard() { window.location.href = 'dashboard.html'; }
function adminLogin() { window.location.href = 'dashboard.html#login'; }

fetch('data/boss_name.json').then(function(r){ return r.json(); }).then(function(d){
  if (d && d.name) { document.getElementById('lobbyName').textContent = d.name; document.title = d.name + ' — Dashboard'; }
}).catch(function(){});
</script>
</body>
</html>
